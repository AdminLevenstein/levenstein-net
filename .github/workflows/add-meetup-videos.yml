name: add-meetup-videos
on:
  push:
    paths:
      - '.github/workflows/add-meetup-videos.yml'
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Fetch, compress, poster
        run: |
          set -e
          mkdir -p tmp
          curl -fsSL -o tmp/a.mp4 'https://www.dropbox.com/scl/fi/nnpqp0rfwn6js8eyvznyi/2026-10-22-Canggu-AI-Meetup.mp4?rlkey=esolulvrzmv8gad8qcl4429lj&st=wrb0akbz&dl=1'
          curl -fsSL -o tmp/b.mp4 'https://www.dropbox.com/scl/fi/z5zka3oylt8njeswymorv/2026-10-08-Canggu-AI-Meetup-Grokbot-and-Jeeves.mp4?rlkey=l82mr1tvhm7qdq5s5dg59lr1p&st=fnbm2wvk&dl=1'
          ls -la tmp
          enc() { ffmpeg -y -loglevel error -i "$1" -vf scale=720:1280 -c:v libx264 -preset medium -crf 28 -pix_fmt yuv420p -c:a aac -b:a 96k -movflags +faststart "$2"; }
          enc tmp/a.mp4 meetup/meetup-2026-10-22.mp4
          enc tmp/b.mp4 meetup/meetup-2026-10-08-grokbot-jeeves.mp4
          ffmpeg -y -loglevel error -ss 12 -i tmp/a.mp4 -frames:v 1 -vf scale=540:960 -q:v 4 meetup/meetup-2026-10-22-poster.jpg
          ffmpeg -y -loglevel error -ss 12 -i tmp/b.mp4 -frames:v 1 -vf scale=540:960 -q:v 4 meetup/meetup-2026-10-08-poster.jpg
          ls -la meetup
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add meetup/meetup-2026-10-22.mp4 meetup/meetup-2026-10-08-grokbot-jeeves.mp4 meetup/meetup-2026-10-22-poster.jpg meetup/meetup-2026-10-08-poster.jpg
          git commit -m "Meetup: add highlight videos for 8 Oct and 22 Oct"
          git push
